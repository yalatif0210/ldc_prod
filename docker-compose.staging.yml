# ─────────────────────────────────────────────────────────────
# Staging override — HTTP sur le port 8080, sans SSL/certbot.
#
# Usage (avec project name pour isoler des conteneurs prod) :
#   docker compose -p ldc_staging \
#     -f docker-compose.yml \
#     -f docker-compose.staging.yml \
#     -f docker-compose.ci.yml \
#     up -d --no-build
#
# Prérequis VPS :
#   - Fichier .env.staging dans le même dossier (copié depuis .env et adapté)
#   - Port 8080 ouvert dans le firewall
# ─────────────────────────────────────────────────────────────
services:

  lab_db:
    container_name: staging_lab_db

  support_db:
    container_name: staging_support_db

  ldc_backend:
    container_name: staging_ldc_backend

  support_bot:
    container_name: staging_support_bot

  pilot_bot:
    container_name: staging_pilot_bot

  grafana:
    container_name: staging_grafana
    environment:
      GF_SERVER_ROOT_URL: http://${STAGING_DOMAIN:-localhost:8080}/grafana/

  ldc_frontend:
    container_name: staging_ldc_frontend
    ports:
      - "8081:80"       # HTTP staging — pas de SSL (8080 réservé à l'ancien backend)
    volumes:
      # Nginx HTTP-only pour staging (remplace le template SSL)
      - ./ldc_frontend/nginx.staging.conf:/etc/nginx/conf.d/default.conf.template:ro
    environment:
      DOMAIN: ${STAGING_DOMAIN:-staging.localhost}

# Overrides des ressources externes non disponibles en staging
volumes:
  certbot_certs:
    external: false   # Pas de Let's Encrypt en staging (HTTP only)

networks:
  shared_db_net:
    external: false   # Pas besoin de PgAdmin en staging
