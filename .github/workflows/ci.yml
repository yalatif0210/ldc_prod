name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Frontend ─────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ldc_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ldc_frontend/package-lock.json

      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  build-frontend:
    name: Build Frontend (prod)
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: ldc_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ldc_frontend/package-lock.json

      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build:prod

  # ── Backend ──────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ldc_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          # Doit correspondre à la longueur minimale attendue par votre config JWT
          JWT_SECRET: ci-test-secret-key-must-be-at-least-256-bits-long-for-hs256

  # ── Python Bots ───────────────────────────────────────────────
  lint-python:
    name: Lint Python Bots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install flake8

      - name: Lint support_ldc
        run: flake8 support_ldc/ --max-line-length=120 --exclude=__pycache__,migrations,venv,.venv

      - name: Lint pilot_bot
        run: flake8 pilot_bot/ --max-line-length=120 --exclude=__pycache__,migrations,venv,.venv
