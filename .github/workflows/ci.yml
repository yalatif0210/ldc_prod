name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Utilise Node.js 24 pour tous les actions (évite les warnings de dépréciation Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Frontend ─────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ldc_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ldc_frontend/package-lock.json

      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run lint

  build-frontend:
    name: Build Frontend (prod)
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: ldc_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ldc_frontend/package-lock.json

      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run build:prod

  # ── Backend ──────────────────────────────────────────────────
  # Pas de fichiers de test pour l'instant — on vérifie uniquement la compilation,
  # identique à ce que fait le Dockerfile (mvn package -DskipTests).
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ldc_backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile & package
        run: mvn -B package -DskipTests

  # ── Python Bots ───────────────────────────────────────────────
  lint-python:
    name: Lint Python Bots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install flake8

      - name: Lint support_ldc
        run: flake8 support_ldc/ --max-line-length=120 --extend-ignore=E401,W503,E302,E231,E501,W292,E128,F401,F541 --exclude=__pycache__,migrations,venv,.venv

      - name: Lint pilot_bot
        run: flake8 pilot_bot/ --max-line-length=120 --extend-ignore=E401,W503,E302,E231,E501,W292,E128,F401,F541,E221,E272,E203 --exclude=__pycache__,migrations,venv,.venv
