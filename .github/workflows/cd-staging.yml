name: CD — Staging

on:
  push:
    branches: [develop]

# Un seul déploiement staging à la fois — annule le précédent si encore en cours
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ── Build & Push images vers ghcr.io ─────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "value=staging-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push — ldc_backend
        uses: docker/build-push-action@v5
        with:
          context: ./ldc_backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:staging
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:staging
          cache-to: type=inline

      - name: Build & Push — ldc_frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ldc_frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:staging
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:staging
          cache-to: type=inline

      - name: Build & Push — support_bot
        uses: docker/build-push-action@v5
        with:
          context: ./support_ldc
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:staging
            ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:staging
          cache-to: type=inline

      - name: Build & Push — pilot_bot
        uses: docker/build-push-action@v5
        with:
          context: ./pilot_bot
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:staging
            ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:staging
          cache-to: type=inline

  # ── Deploy sur VPS ────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          CI_IMAGE_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.VPS_STAGING_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,CI_IMAGE_OWNER,GHCR_TOKEN,GITHUB_ACTOR,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git fetch origin develop
            git reset --hard origin/develop

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export IMAGE_TAG="$IMAGE_TAG"
            export CI_IMAGE_OWNER="$CI_IMAGE_OWNER"

            docker compose \
              -p ldc_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              -f docker-compose.ci.yml \
              pull

            docker compose \
              -p ldc_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              -f docker-compose.ci.yml \
              up -d --no-build

            docker image prune -f
            echo "Staging déployé : $IMAGE_TAG"
