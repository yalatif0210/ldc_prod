name: CD — Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # ex: v1.0.0, v1.2.3, v2.0.0

# Pas de cancel-in-progress pour la prod — chaque déploiement doit se terminer
concurrency:
  group: deploy-production

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ── Build & Push images vers ghcr.io ─────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        # GITHUB_REF_NAME = le tag git (ex: v1.2.0)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push — ldc_backend
        uses: docker/build-push-action@v5
        with:
          context: ./ldc_backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/ldc_backend:latest
          cache-to: type=inline

      - name: Build & Push — ldc_frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ldc_frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/ldc_frontend:latest
          cache-to: type=inline

      - name: Build & Push — support_bot
        uses: docker/build-push-action@v5
        with:
          context: ./support_ldc
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/support_bot:staging
          cache-to: type=inline

      - name: Build & Push — pilot_bot
        uses: docker/build-push-action@v5
        with:
          context: ./pilot_bot
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/pilot_bot:staging
          cache-to: type=inline

  # ── Deploy sur VPS (avec approbation manuelle) ────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    # Environnement GitHub avec "Required reviewers" configuré dans Settings
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          CI_IMAGE_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.VPS_PROD_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,CI_IMAGE_OWNER,GHCR_TOKEN,GITHUB_ACTOR,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git fetch --tags origin
            git checkout "$IMAGE_TAG"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export IMAGE_TAG="$IMAGE_TAG"
            export CI_IMAGE_OWNER="$CI_IMAGE_OWNER"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.ci.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.ci.yml \
              up -d --no-build

            docker image prune -f
            echo "Production déployée : $IMAGE_TAG"
